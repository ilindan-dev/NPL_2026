# Конфигурация сервиса - пример для конвертации в TOML
title: "Сервис заказов"
version: 2
debug: false
release_date: 2026-10-01
owner: Илья          # строка без кавычек
description: 'Строка в одинарных кавычках, с # решёткой внутри'
timeout_sec: 2.5
max_retries:          # пустое значение = null

server:
  host: 0.0.0.0
  port: 8080
  allowed_origins: [https://example.com, "http://localhost:3000"]
  tls:
    enabled: true
    cert: /etc/ssl/cert.pem

database:
  url: postgres://db.local:5432/orders
  pool: { min: 2, max: 20 }

features:
  - payments
  - notifications
  - "beta: new checkout"

workers:
  - name: email
    threads: 4
    queues: [high, low]
  - name: reports
    threads: 1
    schedule:
      cron: "0 3 * * *"
      timezone: Europe/Moscow

"key with spaces": value
