// Схема в стиле примера addressbook из документации Protobuf
syntax = "proto3";
package demo;

enum PhoneType {
  MOBILE = 0;
  HOME = 1;
  WORK = 2;
}

message PhoneNumber {
  string number = 1;
  PhoneType type = 2;
}

message Person {
  string name = 1;
  int32 id = 2;
  string email = 3;
  repeated PhoneNumber phones = 4;
  repeated string tags = 5;
  bool is_active = 6;
  double balance = 7;
  int64 last_login_ms = 8;
  bytes avatar = 9;
  Address home_address = 10;

  message Address {
    string city = 1;
    string street = 2;
    uint32 zip_code = 3;
  }
}

message AddressBook {
  repeated Person people = 1;
}
